<!doctype html>
<!--
  Source of site/favicon-32.png and site/favicon-16.png: the E of the locked ECHO wordmark with its
  hairline, on Night navy, reduced for a browser tab. Open as favicon.html#32 or #16 and render at
  that size with Playwright. See docs/launch/store-graphics.md.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ECHO favicon</title>
  <style>
    @font-face {
      font-family: 'Cormorant Garamond';
      font-weight: 500 600;
      src: url('/site/assets/fonts/cormorant-garamond-latin.woff2') format('woff2');
    }
    html, body { margin: 0; background: #13263a; }
    .tile {
      --size: 32px;
      width: var(--size);
      height: var(--size);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #13263a;
      color: #f7f3eb;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
    }
    .e { font-size: calc(var(--size) * 0.72); line-height: calc(var(--size) * 0.62); }
    .mark { width: calc(var(--size) * 0.34); height: max(1px, calc(var(--size) * 0.045)); margin-top: calc(var(--size) * 0.1); background: #f7f3eb; }
  </style>
</head>
<body>
  <div class="tile" id="tile"><span class="e">E</span><span class="mark"></span></div>
  <script>
    var size = parseInt(location.hash.slice(1), 10) || 32;
    document.getElementById('tile').style.setProperty('--size', size + 'px');
  </script>
</body>
</html>
