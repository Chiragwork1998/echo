services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: echo
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: echo_local_only
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U echo -d echo']
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - echo-postgres-data:/var/lib/postgresql/data

volumes:
  echo-postgres-data:
